<svg viewBox="0 0 1760 1040" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8FA6C7"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#25D366"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF5C5C"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F5A623"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6FE0C8"/>
    </marker>
  </defs>

  <!-- fondo -->
  <rect x="0" y="0" width="1760" height="1040" fill="#0A1420"/>
  <rect x="0" y="0" width="1760" height="1040" fill="url(#grid)"/>

  <!-- titulo -->
  <text x="880" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#EAF2FF">Restaurante Colo Bot — cómo se conecta todo</text>
  <text x="880" y="70" text-anchor="middle" font-size="13" font-family="'SF Mono', Consolas, monospace" fill="#6B84A8">Cliente · Meta WhatsApp Cloud API · ngrok · n8n · FastAPI  —  Día 1 y Día 2</text>

  <!-- ===== CLIENTE ===== -->
  <rect x="50" y="230" width="230" height="110" rx="10" fill="#14301F" stroke="#25D366" stroke-width="2"/>
  <text x="165" y="266" text-anchor="middle" font-size="18" font-weight="700" fill="#DFF7E6">Cliente</text>
  <text x="165" y="290" text-anchor="middle" font-size="12" fill="#9FE6BB">tu WhatsApp personal</text>
  <text x="165" y="310" text-anchor="middle" font-size="11" font-family="'SF Mono', Consolas, monospace" fill="#7FCE9F">+54 9 2625 63-4845</text>

  <!-- ===== META OUTER BOX ===== -->
  <rect x="380" y="140" width="380" height="680" rx="12" fill="none" stroke="#2E6FED" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="570" y="165" text-anchor="middle" font-size="15" font-weight="700" fill="#7FAEFF">Meta — WhatsApp Cloud API (3 capas)</text>

  <!-- Numero -->
  <rect x="410" y="190" width="320" height="105" rx="10" fill="#12233F" stroke="#2E6FED" stroke-width="1.5"/>
  <text x="570" y="220" text-anchor="middle" font-size="15" font-weight="700" fill="#CFE0FF">Capa 1 — Número de teléfono</text>
  <text x="570" y="242" text-anchor="middle" font-size="12" fill="#9BBBEA">+1 555 666 8817</text>
  <text x="570" y="262" text-anchor="middle" font-size="10" font-family="'SF Mono', Consolas, monospace" fill="#7FA0C9">Phone Number ID: 1241263685734238</text>

  <!-- Numero -> WABA (funciona) -->
  <line x1="570" y1="295" x2="570" y2="418" stroke="#8FA6C7" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <text x="586" y="360" font-size="11" fill="#B7C8E5">✓ el mensaje ingresa</text>

  <!-- WABA -->
  <rect x="410" y="420" width="320" height="105" rx="10" fill="#12233F" stroke="#2E6FED" stroke-width="1.5"/>
  <text x="570" y="450" text-anchor="middle" font-size="15" font-weight="700" fill="#CFE0FF">Capa 2 — WABA</text>
  <text x="570" y="470" text-anchor="middle" font-size="11" fill="#9BBBEA">WhatsApp Business Account</text>
  <text x="570" y="490" text-anchor="middle" font-size="10" font-family="'SF Mono', Consolas, monospace" fill="#7FA0C9">id: 2468202600345069</text>

  <!-- WABA -> App (FALTA, el bug) -->
  <line x1="570" y1="525" x2="570" y2="648" stroke="#FF5C5C" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-red)"/>
  <text x="586" y="573" font-size="12" font-weight="700" fill="#FF9C9C">⚠ subscribed_apps</text>
  <text x="586" y="590" font-size="10" fill="#FF9C9C">FALTA crear este link</text>
  <text x="586" y="606" font-size="10" font-style="italic" fill="#FF9C9C">(bug de anoche)</text>

  <!-- App -->
  <rect x="410" y="650" width="320" height="105" rx="10" fill="#12233F" stroke="#2E6FED" stroke-width="1.5"/>
  <text x="570" y="678" text-anchor="middle" font-size="15" font-weight="700" fill="#CFE0FF">Capa 3 — App de Meta</text>
  <text x="570" y="698" text-anchor="middle" font-size="11" fill="#9BBBEA">Accelerate Restaurant Bot</text>
  <text x="570" y="716" text-anchor="middle" font-size="10" font-family="'SF Mono', Consolas, monospace" fill="#7FA0C9">Callback URL + Verify Token ✓</text>

  <!-- Cliente -> Numero -->
  <line x1="280" y1="258" x2="408" y2="222" stroke="#25D366" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="292" y="238" font-size="10" fill="#A8F0C4">1. "hola"</text>

  <!-- Numero -> Cliente (entrega) -->
  <line x1="408" y1="272" x2="280" y2="308" stroke="#25D366" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-green)"/>
  <text x="292" y="298" font-size="10" fill="#8FD9AC">7. respuesta</text>

  <!-- ===== NGROK ===== -->
  <rect x="860" y="650" width="200" height="105" rx="10" fill="#0F2E2A" stroke="#14B8A6" stroke-width="2"/>
  <text x="960" y="682" text-anchor="middle" font-size="17" font-weight="700" fill="#B6F5E8">ngrok</text>
  <text x="960" y="702" text-anchor="middle" font-size="11" fill="#7FE0CE">túnel público</text>
  <text x="960" y="720" text-anchor="middle" font-size="9" font-family="'SF Mono', Consolas, monospace" fill="#4FBFA8">...ngrok-free.dev</text>
  <text x="960" y="734" text-anchor="middle" font-size="9" font-family="'SF Mono', Consolas, monospace" fill="#4FBFA8">→ localhost:5678</text>

  <!-- App -> ngrok (entra en la parte SUPERIOR del borde derecho de App) -->
  <line x1="732" y1="670" x2="858" y2="670" stroke="#8FA6C7" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <text x="745" y="658" font-size="9" font-family="'SF Mono', Consolas, monospace" fill="#C7D6EE">2. POST webhook</text>

  <!-- ===== N8N ===== -->
  <rect x="1170" y="630" width="240" height="150" rx="10" fill="#33121C" stroke="#EA4B71" stroke-width="2"/>
  <text x="1290" y="665" text-anchor="middle" font-size="18" font-weight="700" fill="#FFD8E0">n8n</text>
  <text x="1290" y="686" text-anchor="middle" font-size="10" fill="#FFB8C6">workflow: Dia 2 - WhatsApp a FastAPI</text>
  <text x="1290" y="702" text-anchor="middle" font-size="10" fill="#FFB8C6">7 nodos: verificación + routing</text>
  <text x="1290" y="722" text-anchor="middle" font-size="10" font-family="'SF Mono', Consolas, monospace" fill="#FF8FA8">localhost:5678</text>
  <text x="1290" y="742" text-anchor="middle" font-size="10" fill="#9BE8B0">Published ✓</text>

  <!-- ngrok -> n8n -->
  <line x1="1062" y1="700" x2="1168" y2="700" stroke="#8FA6C7" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <text x="1115" y="688" text-anchor="middle" font-size="10" fill="#C7D6EE">3. reenvía</text>

  <!-- ===== FASTAPI ===== -->
  <rect x="1520" y="655" width="190" height="105" rx="10" fill="#08211F" stroke="#049688" stroke-width="2"/>
  <text x="1615" y="687" text-anchor="middle" font-size="17" font-weight="700" fill="#B9F3EA">FastAPI</text>
  <text x="1615" y="707" text-anchor="middle" font-size="11" fill="#85D9C8">tu servidor Python</text>
  <text x="1615" y="725" text-anchor="middle" font-size="10" font-family="'SF Mono', Consolas, monospace" fill="#4FBFA8">127.0.0.1:8000</text>
  <text x="1615" y="740" text-anchor="middle" font-size="10" font-family="'SF Mono', Consolas, monospace" fill="#4FBFA8">POST /webhook</text>

  <!-- n8n -> FastAPI -->
  <line x1="1412" y1="690" x2="1518" y2="690" stroke="#8FA6C7" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <text x="1465" y="678" text-anchor="middle" font-size="10" fill="#C7D6EE">4. POST</text>

  <!-- FastAPI -> n8n (respuesta) -->
  <line x1="1518" y1="732" x2="1412" y2="732" stroke="#6FE0C8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-teal)"/>
  <text x="1465" y="752" text-anchor="middle" font-size="10" fill="#9FEEDD">5. respuesta</text>

  <!-- n8n -> Meta App directo (curva, bypass ngrok). Entra por la parte INFERIOR del borde derecho de App -->
  <path d="M 1290 628 C 1120 385, 880 385, 732 738" fill="none" stroke="#F5A623" stroke-width="3" marker-end="url(#arrow-amber)"/>
  <text x="960" y="382" text-anchor="middle" font-size="13" font-weight="700" fill="#FFD59A">6. n8n llama directo a la API de Meta</text>
  <text x="960" y="400" text-anchor="middle" font-size="10" font-family="'SF Mono', Consolas, monospace" fill="#F5C177">graph.facebook.com/v21.0/.../messages</text>
  <text x="960" y="416" text-anchor="middle" font-size="10" font-style="italic" fill="#FF9C9C">(esta llamada NO pasa por ngrok)</text>

  <!-- ===== LEYENDA ===== -->
  <rect x="50" y="850" width="1660" height="130" rx="10" fill="#0F1A28" stroke="#233248" stroke-width="1"/>
  <text x="75" y="878" font-size="13" font-weight="700" fill="#C7D6EE">Cómo leer las flechas</text>

  <line x1="75" y1="905" x2="130" y2="905" stroke="#8FA6C7" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <text x="140" y="909" font-size="11" fill="#B7C8E5">mensaje viajando hacia adelante</text>

  <line x1="75" y1="932" x2="130" y2="932" stroke="#6FE0C8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-teal)"/>
  <text x="140" y="936" font-size="11" fill="#9FEEDD">respuesta de vuelta</text>

  <line x1="470" y1="905" x2="525" y2="905" stroke="#F5A623" stroke-width="3" marker-end="url(#arrow-amber)"/>
  <text x="535" y="909" font-size="11" fill="#FFD59A">llamada directa a la API de Meta (sin pasar por ngrok)</text>

  <line x1="470" y1="932" x2="525" y2="932" stroke="#FF5C5C" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-red)"/>
  <text x="535" y="936" font-size="11" fill="#FF9C9C">conexión que falta configurar (a resolver hoy a la tarde)</text>

  <line x1="1080" y1="905" x2="1135" y2="905" stroke="#25D366" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="1145" y="909" font-size="11" fill="#A8F0C4">ida y vuelta con el cliente de WhatsApp</text>

  <text x="75" y="964" font-size="11" font-family="'SF Mono', Consolas, monospace" fill="#5A7096">Ver "explicacion-tecnica-dias-1-2.md" para el detalle completo de cada pieza, cada nodo de n8n y cada clave usada.</text>

  <text x="880" y="1020" text-anchor="middle" font-size="11" font-family="'SF Mono', Consolas, monospace" fill="#3E5171">Accelerate.ai — Restaurante Colo — Día 1 y Día 2 · 5 de agosto de 2026</text>
</svg>
